<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Corpsewood Reservation System</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470") no-repeat center center fixed;
    background-size: cover;
    overflow: hidden;
}

/* MAIN UI */
.overlay {
    background: rgba(0, 0, 0, 0.55);
    min-height: 100vh;
    padding: 40px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: rgba(255, 255, 255, 0.95);
    padding: 25px;
    border-radius: 6px;
}

h1 { margin-top: 0; font-size: 22px; }

label { display: block; margin-top: 12px; }

input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #bbb;
    border-radius: 3px;
}

button {
    margin-top: 15px;
    padding: 10px 15px;
    border: none;
    background: #1d3557;
    color: white;
    cursor: pointer;
    border-radius: 3px;
}

.footer {
    font-size: 12px;
    color: #666;
    margin-top: 20px;
}

/* LORE */
.lore {
    position: fixed;
    bottom: 15px;
    left: 20px;
    right: 20px;

    font-size: 12px;
    color: rgba(0, 0, 0, 0.18);
    font-style: italic;
    line-height: 1.6;

    cursor: pointer;
}

/* PANIC */
body.panic .overlay {
    animation: collapse 2s forwards;
}

@keyframes collapse {
    0% { opacity: 1; filter: blur(0); }
    40% { filter: blur(2px) contrast(1.5); }
    80% { opacity: 0.2; filter: blur(6px) contrast(2); }
    100% { opacity: 0; visibility: hidden; }
}

/* GLITCH LAYERS */
.glitch-layer {
    position: fixed;
    left: 0;
    width: 100%;
    height: 25vh;
    opacity: 0;
    pointer-events: none;
    z-index: 9998;
}

.glitch-1 { top: 10%; }
.glitch-2 { top: 40%; }
.glitch-3 { top: 70%; }

body.panic .glitch-layer {
    opacity: 0.7;
    animation: tear 0.2s infinite alternate;
    mix-blend-mode: difference;
}

@keyframes tear {
    0% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    100% { transform: translateX(-4px); }
}

/* BROKEN STATE */
body.broken {
    background: black;
}

body.broken .overlay {
    display: none;
}

body.broken::before {
    content: "SYSTEM CORRUPTION DETECTED";
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 18px;
    letter-spacing: 2px;
    opacity: 0.8;
}

/* RESTORE BUTTON */
#restoreBtn {
    position: fixed;
    top: 60%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10000;
}

#restoreBtn button {
    padding: 12px 18px;
    background: #1d3557;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.lore.panic {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(2);

    font-size: 20px;
    color: black;

    background: rgba(255,255,255,0.95);
    padding: 25px;
    border-radius: 10px;

    text-align: center;
    z-index: 9999;
}
</style>
</head>

<body>

<div class="overlay">
<div class="container">

<h1>Corpsewood Reservation System</h1>

<label>Name</label>
<input type="text">

<label>Date of Visit</label>
<input type="date">

<label>Group Size</label>
<input type="number">

<button onclick="window.location.href='https://corpsewood.github.io/entrance/'">
    Submit Reservation
</button>

<div class="footer">
All reservations are recorded for forestry compliance tracking.
</div>

</div>
</div>

<!-- LORE -->
<div class="lore">
    The old wind still moves through these trees.  
    It remembers what we have forgotten.  

    Daed was last seen near the perimeter routes.  
    Old Wind does not register him as missing.  
</div>

<!-- GLITCH LAYERS -->
<div class="glitch-layer glitch-1"></div>
<div class="glitch-layer glitch-2"></div>
<div class="glitch-layer glitch-3"></div>

<script>
function playGlitchSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(80, ctx.currentTime);

    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.3);
}

function showRestoreButton() {
    if (document.getElementById("restoreBtn")) return;

    const btn = document.createElement("div");
    btn.id = "restoreBtn";
    btn.innerHTML = `<button>Restore System</button>`;
    document.body.appendChild(btn);

    btn.querySelector("button").addEventListener("click", () => {
        localStorage.removeItem("corpsewood_corrupt");
        location.reload();
    });
}

/* restore state on load */
if (localStorage.getItem("corpsewood_corrupt") === "true") {
    document.body.classList.add("broken");
    showRestoreButton();
}

/* trigger corruption */
document.querySelector(".lore").addEventListener("click", function () {
    playGlitchSound();

    this.classList.add("panic");

    setTimeout(() => {
        document.body.classList.add("panic");
        localStorage.setItem("corpsewood_corrupt", "true");

        setTimeout(() => {
            document.body.classList.add("broken");
            showRestoreButton();
        }, 2000);

    }, 120);
});
</script>

</body>
</html>
